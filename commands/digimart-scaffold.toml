description = "Scaffold a new Digimart integration"
prompt = "Scaffold a Digimart integration for this project: {{args}}. Follow the digimart-scaffold skill in order: establish what exists (approved app, CaaS API and SDK enabled, header enrichment, notification URLs, App Password, client types); pick the host project's own stack; config from templates/.env.example before any code; the SHA-512 URL signer with a fixed-vector test that hashes myApiKey123|2024-08-08T12:00:00Z|mySecretKey456|50 to 3badf638ceca499000fd07b899e5fc0cec348d9762886b8430104291126683892845a208caef8e99b53432571e46c5f04162a1a25646443f7935239ea0901b38; a server-side start endpoint that prices the item, persists the order with a fresh 15-digit requestId and returns the signed URL; the REST client; then the inbound handlers. Take every call from references/13-integration-reference.md and check a built URL with `node tools/digimart.mjs check-url`."
