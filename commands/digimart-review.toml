description = "Review Digimart integration code for money, security and approval risks"
prompt = "Review the Digimart integration in this project{{args}}. Run `node tools/digimart.mjs practices` and follow the digimart-review skill. Critical: the API Secret or signing code reachable from a client, hardcoded secrets, fulfilment on the redirect, the amount taken from the client, a wrong signing string (secret not in the middle, amount missing on one-time or signed on a subscription, SHA-256, uppercase hex, encoded values hashed), requestTime or amount formatted twice, notifications settling without checks, disabled TLS verification. Then the high and medium items, including a missing cancel path. Report file:line, most severe first, with the fix, and a plain verdict."
