description = "Work on a Digimart integration (Subscription SDK, One-time charging SDK, REST subscriber APIs)"
prompt = "Use the Digimart skill for this task. Digimart charges Grameenphone subscribers' mobile balance in Bangladesh, run by hSenid Mobile Solutions. Its charging services are SIGNED URLS opened in the customer's browser, not REST APIs; only Subscriber List, Subscriber Charging Info and User Unsubscription are REST, on api.digimart.store with applicationId + App Password. Before writing code, query the contract: `node tools/digimart.mjs list` and `node tools/digimart.mjs show <id>`. Non-negotiable: sign on the server only (apiKey|requestTime|apiSecret, plus |amount for one-time, SHA-512, lowercase hex, requestTime and amount byte-identical in hash and URL); secrets from environment variables only; a fresh 15-digit requestId per URL persisted before redirecting; the amount from a server-side price list (1-600 BDT); deliver only on the notification, never on the redirect; a working cancel via POST /subs/unregistration; never invent endpoints (no SMS, USSD, OTP or balance API exists on Digimart). Write the integration in whatever language this project already uses — templates/ covers TypeScript/Node, Python, Java, Go, PHP and C#, and references/10-any-stack.md specifies it for any other stack. Task: {{args}}"
