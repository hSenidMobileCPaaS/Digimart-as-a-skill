description = "Implement Digimart's redirect page and notification handlers"
prompt = "Implement or fix Digimart's inbound handlers: {{args}}. Three surfaces: the browser redirect to redirectUrl (query parameters subscriptionStatus, subscriberId, requestId — untrusted, pick a screen, grant nothing), the charging notification on the Async charging resp URL (settle only on statusCode S1000 with applicationId, requestId and paidAmount checked; dedupe on internalTrxId + statusCode) and the subscription notification on the Subscription Notification URL (map subscriberRequestId to the user, store subscriberId, dedupe on subscriberId + status + timeStamp). Answer HTTP 200 first and process asynchronously; no response body and no signature are published. Run `node tools/digimart.mjs show <id>` for each, and test with ./scripts/test-callbacks.sh."
