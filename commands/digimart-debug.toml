description = "Diagnose a failing Digimart URL, notification or REST call"
prompt = "Diagnose this Digimart problem: {{args}}. Run `node tools/digimart.mjs diagnose` with the symptom and `node tools/digimart.mjs code <CODE>` for any status code. If you can get the actual artefacts they answer faster than any guess: `node tools/digimart.mjs check-url '<the URL the code built>'` (export DIGIMART_API_SECRET and it recomputes the signature and names the mistake), `node tools/digimart.mjs redirect '<the landing URL>'`, `node tools/digimart.mjs validate charging-notification '<body>'`, `node tools/digimart.mjs response <id> '<REST body>'`. For E1002 first confirm the code reproduces `node tools/digimart.mjs sign --example one-time`. Remember REST codes other than S1000 have no published meaning. Give the most likely cause and the specific fix."
